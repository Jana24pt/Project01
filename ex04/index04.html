<!DOCTYPE html>
<html lang="en">
<head>
<title>42</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h1> User registration page</h1>

<form>
<label for="name">Enter your name</label>
<input type="text" id="name" name="name" required>
<br>
<label for="password">Enter your password</label>
<input type="password" id="password" name="password" required minlength="8">
<br>
<label for="email">Enter your email</label>
<input type="email" id="email" name="email" required minlength="8">

<p>Choose your city:</p>
<input type="radio" id="amman" name="city">
<label for="amman">Amman</label>
<input type="radio" id="irbid" name="city">
<label for="irbid">Irbid</label>
<br>
<label for="agreement">Do you consent to the use of your data for recruitment purposes?</label>
<input type="checkbox" id="agreement" name="agreement" required>
<br>
<label for="Time_option">Choose your suitable time</label>
<select id="Time_option" name="Time_option" required>
<option>9:00AM to 2:00PM</option>
<option>3:00PM to 8:00PM</option>
</select>
<br>
<label for="suggestions">Any suggestions?</label>
<textarea id="suggestions" name="suggestions" cols="30" rows="10"></textarea><br>
<label for="submition">Send your information</label>
<input id="submition" type="submit">
</form>

</body>
</html>
